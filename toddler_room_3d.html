<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Toddler room 3D viewer</title>
<style>
:root{--bg:#fff;--fg:#1f1e1b;--mu:#6b6a64;--bd:#d3d1c7;--ac:#185FA5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1b;--fg:#f1efe8;--mu:#b4b2a9;--bd:#444441;--ac:#85B7EB}}
:root[data-theme="dark"]{--bg:#1f1e1b;--fg:#f1efe8;--mu:#b4b2a9;--bd:#444441;--ac:#85B7EB}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
#v{position:relative;width:100%;max-width:900px;margin:0 auto;border:1px solid var(--bd);border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;background:#222}
canvas{display:block;width:100%}
.bar{max-width:900px;margin:10px auto;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}
p{max-width:900px;margin:8px auto;color:var(--mu);font-size:13px}
</style></head><body>
<div id="v"></div>
<div class="bar"><button id="c1" class="on">From centre</button><button id="c2">From door</button><button id="dm">Dimensions</button><button id="ar">Auto-rotate</button></div>
<p>Drag to look around, scroll or pinch to zoom. The 3D model is built from your measurements, so furniture heights and the window are estimates.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,box=document.getElementById('v');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x2a2926);
S.add(new T.AmbientLight(0xffffff,.42),new T.HemisphereLight(0xffffff,0x8a7a66,.28));
const dl=new T.DirectionalLight(0xffffff,.4);dl.position.set(1,3,2);S.add(dl);
function B(x0,x1,y0,y1,z0,z1,c,o){const m=new T.Mesh(new T.BoxGeometry(x1-x0,y1-y0,z1-z0),o===-1?new T.MeshBasicMaterial({color:c}):new T.MeshLambertMaterial({color:c,transparent:!!o,opacity:o||1}));m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);S.add(m);if(o!==-1){const e=new T.LineSegments(new T.EdgesGeometry(m.geometry),new T.LineBasicMaterial({color:0x3a3935,transparent:true,opacity:.55}));e.position.copy(m.position);S.add(e)}return m}
const room=new T.Mesh(new T.BoxGeometry(2.7,2.4,3.4),new T.MeshLambertMaterial({color:0xcfccc2,side:T.BackSide}));room.position.set(1.35,1.2,1.7);S.add(room);
B(0,2.7,-.02,0,0,3.4,0x9c7448);
const cols=[0x7F77DD,0xEF9F27,0x5DCAA5,0x85B7EB,0xF0997B,0x97C459,0xED93B1,0xAFA9EC,0x5DCAA5];
B(0,.44,0,.94,1.25,2.24,0xf3f1ea);
for(let r=0;r<3;r++)for(let c=0;c<3;c++)B(.44,.47,.03+r*.3,.3+r*.3,1.28+c*.31,1.57+c*.31,cols[r*3+c]);
B(2.1,2.7,0,1.81,2.83,3.4,0xf1efe8);B(2.12,2.68,.1,1.71,2.81,2.83,0xffffff);B(2.16,2.19,.9,1.1,2.79,2.81,0x888780);
B(1.63,2.7,.1,.3,0,1.9,0xd8c4a0);B(1.65,2.68,.3,.45,.02,1.88,0xfbf6e9);B(1.8,2.55,.45,.52,.08,.38,0xc77c86);B(1.6,1.62,.3,.75,.5,1.7,0xe0f0f0,.5);
B(1.7,2.62,.95,2.05,0,.04,0x222222);B(1.74,2.58,.99,2.01,.04,.05,0xbfe0f0,-1);B(2.15,2.17,.99,2.01,.05,.06,0x222222);B(1.74,2.58,1.49,1.51,.05,.06,0x222222);B(1.7,2.62,2.08,2.36,0,.2,0xfafafa);
B(2.66,2.7,.9,1.95,1.95,2.5,0x222222);B(2.65,2.66,.94,1.91,1.99,2.46,0xbfe0f0,-1);B(.5,1.2,0,.012,1.3,2.45,0x5DB8A0);
B(0,.6,.7,.73,0,1.2,0xe9c27a);[[.02,.02],[.55,.02],[.02,1.15],[.55,1.15]].forEach(p=>B(p[0],p[0]+.03,0,.7,p[1],p[1]+.03,0xe9c27a));
[.6].forEach(z=>{const s=new T.Mesh(new T.CylinderGeometry(.17,.17,.45,20),new T.MeshLambertMaterial({color:0x7F77DD}));s.position.set(.9,.225,z);S.add(s)});
B(0,.06,1.1,1.15,.3,.9,0xffffff);for(let i=0;i<5;i++)B(.01,.045,1.15,1.31,.32+i*.11,.41+i*.11,cols[i]);
B(0,.85,0,2,3.38,3.4,0x8c8a84);B(0,.04,0,2,2.55,3.4,0xe3d3b5);B(1.33,2.08,0,2,3.37,3.4,0xb8946a);B(1.4,1.43,1,1.04,3.33,3.37,0x444444);
const ap=[];for(let i=0;i<=20;i++){const t=i*Math.PI/40;ap.push(new T.Vector3(.85*Math.sin(t),.01,3.4-.85*Math.cos(t)))}
S.add(new T.Line(new T.BufferGeometry().setFromPoints(ap),new T.LineBasicMaterial({color:0xe24b4a})));
function L(s,x,y,z){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(31,30,27,.85)';g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='28px sans-serif';g.textAlign='center';g.fillText(s,128,42);const p=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));p.scale.set(.5,.125,1);p.position.set(x,y,z);S.add(p)}
L('Trofast 3×3',.4,1.1,1.75);L('Desk',.3,.95,.6);L('Wardrobe',2.4,2.05,3.1);L('Bed',2.15,.75,1.2);L('North window + aircon',2.15,2.5,.3);L('Toilet door',1.7,2.15,3.2);L('East window',2.3,2.1,2.22);L('Play rug',.85,.35,1.9);
const D=new T.Group();D.visible=false;S.add(D);const V=a=>new T.Vector3(a[0],a[1],a[2]);
function dim(a,b,s){const y=0xffe08a;D.add(new T.Line(new T.BufferGeometry().setFromPoints([V(a),V(b)]),new T.LineBasicMaterial({color:y,depthTest:false,transparent:true})));[a,b].forEach(p=>{const d=new T.Mesh(new T.SphereGeometry(.015,8,8),new T.MeshBasicMaterial({color:y,depthTest:false,transparent:true}));d.position.copy(V(p));D.add(d)});
const c=document.createElement('canvas');c.width=192;c.height=48;const g=c.getContext('2d');g.fillStyle='rgba(31,30,27,.85)';g.fillRect(0,0,192,48);g.fillStyle='#ffe08a';g.font='26px sans-serif';g.textAlign='center';g.fillText(s,96,33);
const p=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));p.scale.set(.3,.075,1);p.position.set((a[0]+b[0])/2,(a[1]+b[1])/2+.05,(a[2]+b[2])/2);D.add(p)}
const DL=[[[.62,.76,0],[.62,.76,1.2],'desk 120'],[[0,.76,1.22],[.6,.76,1.22],'60'],[[0,.96,2.26],[.44,.96,2.26],'44'],[[.46,.96,1.25],[.46,.96,2.24],'99'],[[.46,0,2.26],[.46,.94,2.26],'94 high'],[[1.58,.56,0],[1.58,.56,1.9],'bed 190'],[[1.63,.56,1.93],[2.7,.56,1.93],'107'],[[.6,.03,.2],[1.63,.03,.2],'103 gap'],[[1.2,.03,1.6],[1.63,.03,1.6],'43 walkway'],[[2,.03,1.9],[2,.03,2.83],'93 clear'],[[2.1,1.86,2.79],[2.7,1.86,2.79],'60'],[[2.05,0,2.79],[2.05,1.81,2.79],'181 high'],[[2.64,0,2.2],[2.64,.9,2.2],'sill 90'],[[1.72,.52,.06],[1.72,.95,.06],'43 to sill'],[[0,.03,3.3],[.85,.03,3.3],'door 85'],[[.85,.03,3.3],[1.33,.03,3.3],'48-55'],[[.2,.03,2.24],[.2,.03,2.55],'31 to door']];
DL.forEach(d=>dim(d[0],d[1],d[2]));
const cam=new T.PerspectiveCamera(70,1.5,.05,20);cam.rotation.order='YXZ';
let yaw=0,pit=0,auto=false,drag=null;const pos={1:[1.35,1.4,1.7,0],2:[.2,1.4,3.2,-.55]};
function sz(){const w=box.clientWidth,h=Math.min(Math.round(w*.62),560);R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
function setCam(k){const p=pos[k];cam.position.set(p[0],p[1],p[2]);yaw=p[3];pit=0;c1.classList.toggle('on',k==1);c2.classList.toggle('on',k==2)}
c1.onclick=()=>setCam(1);c2.onclick=()=>setCam(2);
ar.onclick=()=>{auto=!auto;ar.classList.toggle('on',auto)};dm.onclick=()=>{D.visible=!D.visible;dm.classList.toggle('on',D.visible)};
const ptr=new Map();let pd=0;function pdist(){const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}
box.onpointerdown=e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);box.setPointerCapture(e.pointerId);box.style.cursor='grabbing';if(ptr.size==2)pd=pdist()};
box.onpointerup=box.onpointercancel=e=>{ptr.delete(e.pointerId);box.style.cursor='grab'};
box.onpointermove=e=>{const p=ptr.get(e.pointerId);if(!p)return;if(ptr.size==1){yaw+=(e.clientX-p[0])*.005;pit+=(e.clientY-p[1])*.004}ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const d=pdist();cam.fov=Math.max(35,Math.min(95,cam.fov-(d-pd)*.15));cam.updateProjectionMatrix();pd=d}};
box.addEventListener('wheel',e=>{e.preventDefault();cam.fov=Math.max(35,Math.min(95,cam.fov+e.deltaY*.05));cam.updateProjectionMatrix()},{passive:false});
addEventListener('resize',sz);sz();setCam(1);
(function f(){requestAnimationFrame(f);if(auto)yaw+=.003;const lim=1.1;pit=Math.max(-lim,Math.min(lim,pit));cam.rotation.set(pit,yaw,0);R.render(S,cam)})();
</script></body></html>
